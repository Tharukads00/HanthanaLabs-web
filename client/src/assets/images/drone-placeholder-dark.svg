<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380" fill="none">
  <rect width="600" height="380" fill="#121216"/>
  
  <!-- Subtle technical grid -->
  <defs>
    <pattern id="droneCadGridDark" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="600" height="380" fill="url(#droneCadGridDark)"/>
  
  <!-- Outer schematic border -->
  <rect x="20" y="20" width="560" height="340" rx="8" stroke="rgba(255,255,255,0.12)" stroke-width="1" fill="none"/>
  
  <!-- Technical title block -->
  <text x="35" y="45" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8" letter-spacing="1">DWG: HL-UAV-450 // AUTONOMOUS MULTIROTOR PLATFORM</text>
  <text x="565" y="45" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">TOP PLAN // REV 04</text>
  
  <!-- Center Drone Geometry -->
  <g transform="translate(300, 180)">
    <!-- Diagonal Carbon-fiber Arms -->
    <line x1="-120" y1="-80" x2="120" y2="80" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
    <line x1="-120" y1="80" x2="120" y2="-80" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
    
    <line x1="-120" y1="-80" x2="120" y2="80" stroke="#f5f5f7" stroke-width="1.8"/>
    <line x1="-120" y1="80" x2="120" y2="-80" stroke="#f5f5f7" stroke-width="1.8"/>

    <!-- Central Avionics Core Housing -->
    <rect x="-45" y="-35" width="90" height="70" rx="12" stroke="#f5f5f7" stroke-width="2" fill="#181820"/>
    <!-- Flight Controller Shield -->
    <rect x="-25" y="-20" width="50" height="40" rx="4" stroke="rgba(41,151,255,0.4)" stroke-width="1" fill="#162234"/>
    <circle cx="0" cy="0" r="4" fill="#2997ff"/>
    <text x="0" y="12" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="600" fill="#2997ff">IMU/FC</text>

    <!-- Propeller Rotors (4x) -->
    <!-- Front-Left -->
    <circle cx="-120" cy="-80" r="45" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="-120" cy="-80" r="14" stroke="#f5f5f7" stroke-width="1.5" fill="#24242e"/>
    <circle cx="-120" cy="-80" r="4" fill="#2997ff"/>
    <!-- Front-Right -->
    <circle cx="120" cy="-80" r="45" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="120" cy="-80" r="14" stroke="#f5f5f7" stroke-width="1.5" fill="#24242e"/>
    <circle cx="120" cy="-80" r="4" fill="#2997ff"/>
    <!-- Rear-Left -->
    <circle cx="-120" cy="80" r="45" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="-120" cy="80" r="14" stroke="#f5f5f7" stroke-width="1.5" fill="#24242e"/>
    <circle cx="-120" cy="80" r="4" fill="#2997ff"/>
    <!-- Rear-Right -->
    <circle cx="120" cy="80" r="45" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="120" cy="80" r="14" stroke="#f5f5f7" stroke-width="1.5" fill="#24242e"/>
    <circle cx="120" cy="80" r="4" fill="#2997ff"/>

    <!-- Modular Payload Rail Forward -->
    <line x1="-16" y1="-45" x2="16" y2="-45" stroke="#f5f5f7" stroke-width="2"/>
    <rect x="-12" y="-55" width="24" height="10" rx="3" stroke="#f5f5f7" stroke-width="1.2" fill="#24242e"/>
    <text x="0" y="-60" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="600" fill="#f5f5f7">PAYLOAD INTERFACE</text>

    <!-- Pitch/Roll Crosshair Orientation -->
    <line x1="-160" y1="0" x2="160" y2="0" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="2 4"/>
    <line x1="0" y1="-110" x2="0" y2="110" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="2 4"/>
  </g>

  <!-- Technical specs callout -->
  <text x="35" y="325" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#f5f5f7">WHEELBASE: 450 mm // FRAME: 3K CARBON MONOCOQUE // MTOW: 3.8 kg</text>
  <text x="35" y="345" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8">APPLICATIONS: COMMERCIAL SURVEY &amp; PERSONAL HIGH-END PHOTOGRAMMETRY</text>
</svg>
