<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <!-- Grid lines -->
      <line x1="0" y1="0" x2="80" y2="0" stroke="rgba(0,229,255,0.05)" stroke-width="0.5"/>
      <line x1="0" y1="0" x2="0" y2="80" stroke="rgba(0,229,255,0.05)" stroke-width="0.5"/>
      <!-- Intersection dots -->
      <circle cx="0" cy="0" r="1.5" fill="rgba(0,229,255,0.1)"/>
      <circle cx="80" cy="0" r="1.5" fill="rgba(0,229,255,0.1)"/>
      <circle cx="0" cy="80" r="1.5" fill="rgba(0,229,255,0.1)"/>
      <circle cx="80" cy="80" r="1.5" fill="rgba(0,229,255,0.1)"/>
    </pattern>
    <!-- Circuit traces -->
    <pattern id="traces" width="240" height="240" patternUnits="userSpaceOnUse">
      <!-- Horizontal trace -->
      <line x1="40" y1="80" x2="120" y2="80" stroke="rgba(0,229,255,0.06)" stroke-width="1"/>
      <circle cx="120" cy="80" r="3" fill="none" stroke="rgba(0,229,255,0.08)" stroke-width="1"/>
      <!-- Vertical trace -->
      <line x1="160" y1="40" x2="160" y2="160" stroke="rgba(0,229,255,0.06)" stroke-width="1"/>
      <circle cx="160" cy="160" r="3" fill="none" stroke="rgba(0,229,255,0.08)" stroke-width="1"/>
      <!-- Corner trace -->
      <polyline points="200,120 200,200 120,200" fill="none" stroke="rgba(0,229,255,0.06)" stroke-width="1"/>
      <circle cx="200" cy="120" r="2" fill="rgba(0,229,255,0.1)"/>
      <!-- Diagonal connector -->
      <line x1="40" y1="200" x2="80" y2="160" stroke="rgba(118,255,3,0.04)" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#grid)"/>
  <rect width="800" height="800" fill="url(#traces)"/>
</svg>
